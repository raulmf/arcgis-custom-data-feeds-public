<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🚖 Polígonos H3 viajes taxi Oporto</title>

  <!-- 🎨 Hoja de estilos del tema oscuro de ArcGIS -->
  <link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/dark/main.css">

  <!-- 🧠 API de ArcGIS JavaScript -->
  <script src="https://js.arcgis.com/4.30/"></script>

  <style>
    /* 🌍 Configuración básica para ocupar toda la pantalla */
    html, body, #viewDiv {
      height: 100%; 
      margin: 0; 
      padding: 0;
    }

    /* 🎛️ Panel flotante de filtro */
    #filterPanel {
      position: absolute;
      top: 30px;
      left: 30px;
      background: rgba(30, 30, 30, 0.95);
      padding: 20px 20px 14px 20px;
      color: white;
      z-index: 99;
      font-family: sans-serif;
      border-radius: 18px;
      font-size: 1.3em;
      box-shadow: 0 8px 32px rgba(0,0,0,0.35);
      max-width: 260px;
    }

    #filterPanel label {
      font-size: 1.2em;
      font-weight: bold;
      letter-spacing: 1px;
    }

    /* 🧾 Campo de entrada del número de taxi */
    #taxiInput {
      width: 100%;
      font-size: 1.2em;
      padding: 10px 8px;
      margin-top: 8px;
      margin-bottom: 16px;
      border-radius: 8px;
      border: 2px solid #FF00FF;
      background: #fff0fa;
      color: #222;
      box-sizing: border-box;
      font-weight: bold;
      outline: none;
      transition: border 0.2s;
    }
    #taxiInput:focus {
      border: 2.5px solid #FF55FF;
      background: #ffe6fa;
    }

    /* 🔘 Botón de filtrado */
    #filterBtn {
      width: 100%;
      font-size: 1.2em;
      padding: 12px 0;
      border-radius: 8px;
      border: none;
      background: linear-gradient(90deg, #FF00FF 0%, #D500F9 100%);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      transition: background 0.2s, color 0.2s;
    }
    #filterBtn:hover, #filterBtn:focus {
      background: linear-gradient(90deg, #FF55FF 0%, #FF00FF 100%);
      color: #fff;
    }
  </style>
</head>

<body>
  <!-- 🗺️ Contenedor principal del mapa -->
  <div id="viewDiv"></div>

  <!-- Commented out filter panel
  <div id="filterPanel">
    <label for="taxiInput">🚕 NºTAXI</label>
    <input type="text" id="taxiInput" value="20000032">
    <button id="filterBtn">🔍 Filtrar</button>
  </div>
  -->

  <script>
    require([
      "esri/Map",
      "esri/views/MapView",
      "esri/layers/FeatureLayer",
      "esri/widgets/Zoom"
    ], (Map, MapView, FeatureLayer, Zoom) => {

      // 🐝 Capa de entidades (hexágonos H3) servida desde DuckDB REST
      const featureLayer = new FeatureLayer({
        url: "http://127.0.0.1:8081/duckdb-provider-honeycombs-cu2025/rest/services/localParquet/FeatureServer/0/",
        customParameters: { h3res: 8 }, // resolución H3 por defecto

        // 🎨 Renderizador: color según número de puntos (densidad de viajes)
        renderer: {
          type: "simple",
          symbol: {
            type: "simple-fill",
            color: [255, 0, 255, 0.1], // color base semitransparente
            outline: {
              color: [200, 200, 200, 0.3],
              width: 1
            }
          },
          visualVariables: [
            {
              type: "color",
              field: "point_count",
              stops: [
                { value: 1, color: [255, 255, 255, 0.1] },      // casi transparente
                { value: 500, color: [230, 200, 255, 0.2] },
                { value: 2000, color: [200, 100, 255, 0.3] },
                { value: 5000, color: [160, 0, 255, 0.4] },
                { value: 10000, color: [120, 0, 200, 0.5] },
                { value: 20000, color: [80, 0, 150, 0.9] }
              ]
            }
          ]
        },

        // 🪶 Popup de información al hacer clic en un hexágono
        popupTemplate: {
          title: "🟣 Hexágono H3",
          content: [
            {
              type: "fields",
              fieldInfos: [
                { fieldName: "point_count", label: "🚦 Inicios de viaje" },
                { fieldName: "h3_id", label: "🧩 ID de celda H3" }
              ]
            }
          ]
        }
      });

      // 🗺️ Configuración del mapa base
      const map = new Map({
        basemap: "dark-gray",
        layers: [featureLayer]
      });

      // 👁️ Vista del mapa en pantalla
      const view = new MapView({
        container: "viewDiv",
        map: map,
        zoom: 12,
        center: [-8.62, 41.15], // 📍 Coordenadas de inicio (Oporto)
        spatialReference: 3857
      });

      // ➖➕ Mueve el control de zoom a la esquina superior derecha
      view.ui.remove("zoom");
      const zoom = new Zoom({ view: view });
      view.ui.add(zoom, "top-right");

      // 🔄 Ajusta dinámicamente la resolución H3 al hacer zoom
      view.watch("scale", (newScale) => {
        let newRes = 8;
        // 72000 < escala ≤ 144000 → nivel 8
        if (newScale > 36_000) newRes = 9;
        else if (newScale > 18_000) newRes = 9;
        else if (newScale > 9_000) newRes = 9;
        else newRes = 9; // Escala ≤ 18000 → nivel 10

        if (newRes !== featureLayer.customParameters.h3res) {
          console.log(`🔁 Resolución H3 actual → ${newRes}`);
          featureLayer.customParameters.h3res = newRes;
          featureLayer.refresh();
        }
      });

      // 🎯 Filtro por número de taxi
      filterBtn.addEventListener("click", () => {
        const taxiValue = document.getElementById("taxiInput").value.trim();

        // 🚗 Si hay número de taxi → aplicar color ramp más vívida
        if (taxiValue) {
          featureLayer.customParameters.taxi_id = taxiValue;
          featureLayer.renderer = {
            type: "simple",
            symbol: {
              type: "simple-fill",
              color: [255, 0, 255, 0.1],
              outline: {
                color: [255, 255, 255, 0.2],
                width: 1
              }
            },
            visualVariables: [
              {
                type: "color",
                field: "point_count",
                stops: [
                  { value: 1, color: [255, 255, 255, 0.1] },   // blanco transparente
                  { value: 5, color: [235, 210, 255, 0.2] },  // lila pálido
                  { value: 10, color: [210, 130, 255, 0.35] }, // magenta suave
                  { value: 15, color: [175, 60, 255, 0.45] }, // magenta brillante
                  { value: 20, color: [145, 20, 230, 0.55] }, // púrpura medio
                  { value: 25, color: [120, 0, 200, 0.65] },  // magenta intenso
                  { value: 70, color: [80, 0, 150, 0.6]}     // violeta oscuro
                ]
              }
            ]
          };
        } else {
          // ❌ Si se limpia el campo → quitar filtro
          delete featureLayer.customParameters.taxi_id;
        }

        // 🔁 Refrescar la capa para aplicar los cambios
        featureLayer.refresh();
      });

    });
  </script>
</body>
</html>
