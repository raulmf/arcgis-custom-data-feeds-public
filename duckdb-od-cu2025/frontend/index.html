<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>:: Integración con DuckDB ::</title>

  <!-- Estilos de ArcGIS -->
  <link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/dark/main.css" />
  <script src="https://js.arcgis.com/4.30/"></script>

  <style>
    /* Layout principal */
    html, body, #viewDiv {
      padding: 0;
      margin: 0;
      height: 100%;
      width: 100%;
    }

    /* Panel de filtros */
    #filterPanel {
      position: absolute;
      top: 30px;
      left: 30px;
      background: rgba(30, 30, 30, 0.95);
      padding: 20px 20px 14px 20px;
      color: white;
      z-index: 99;
      font-family: sans-serif;
      border-radius: 18px;
      font-size: 1.2em;
      box-shadow: 0 8px 32px rgba(0,0,0,0.35);
      min-width: 280px;
    }

    /* Etiquetas dentro del panel */
    #filterPanel label {
      font-size: 1.1em;
      font-weight: bold;
      letter-spacing: 1px;
      margin-top: 10px;
      display: block;
    }

    /* Inputs del panel de filtros */
    #taxiInput, #startDateInput, #endDateInput {
      width: 100%;
      font-size: 1.1em;
      padding: 10px 8px;
      margin-top: 6px;
      margin-bottom: 14px;
      border-radius: 8px;
      border: 2px solid #FF00FF;
      background: #fff0fa;
      color: #222;
      box-sizing: border-box;
      font-weight: bold;
      outline: none;
      transition: border 0.2s;
    }

    #taxiInput:focus, #startDateInput:focus, #endDateInput:focus {
      border: 2.5px solid #FF55FF;
      background: #ffe6fa;
    }

    /* Botón Filtrar */
    #filterBtn {
      width: 100%;
      font-size: 1.2em;
      padding: 12px 0;
      border-radius: 8px;
      border: none;
      background: linear-gradient(90deg, #FF00FF 0%, #D500F9 100%);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      transition: background 0.2s, color 0.2s;
    }

    #filterBtn:hover, #filterBtn:focus {
      background: linear-gradient(90deg, #FF55FF 0%, #FF00FF 100%);
      color: #fff;
    }

    /* Contador de resultados */
    #countDisplay {
      margin-top: 10px;
      font-size: 1.4em;
      font-weight: bold;
      color: #FF00FF;
      text-shadow: 1px 1px 6px #222;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>
  <div id="viewDiv"></div>

  <!-- Panel de filtros -->
  <div id="filterPanel">
    <label for="taxiInput">TAXI Nº</label>
    <input type="text" id="taxiInput" value="20000403" />

    <label for="startDateInput">FECHA INICIO (YYYY-MM-DD)</label>
    <input type="text" id="startDateInput" value="2013-07-01" />

    <label for="endDateInput">FECHA FIN (YYYY-MM-DD)</label>
    <input type="text" id="endDateInput" value="2013-07-07" />

    <button id="filterBtn">Filtrar</button>
    <div id="countDisplay">Esperando filtro...</div>
  </div>

  <script>
    require([
      "esri/Map",
      "esri/views/MapView",
      "esri/layers/FeatureLayer"
    ], (Map, MapView, FeatureLayer) => {

      // Crear el mapa base
      const map = new Map({
        basemap: "dark-gray"
      });

      // Crear la vista del mapa
      const view = new MapView({
        container: "viewDiv",
        map: map,
        extent: {
          xmin: -8.85,
          ymin: 41.05,
          xmax: -8.45,
          ymax: 41.25,
          spatialReference: 4326
        }
      });

      // Definir la capa de taxis (sin cargar inicialmente)
      const featureLayer = new FeatureLayer({
        url: "http://127.0.0.1:8082/duckdb-provider-od-cu2025/rest/services/localParquet/FeatureServer/0",
        renderer: {
          type: "simple",
          symbol: {
            type: "simple-line",
            color: "#FF00FF",
            width: 0.8,
            style: "solid",
            marker: {
              style: "arrow",
              placement: "end",
              color: "#FF00FF",
              size: 6
            }
          }
        },
        popupTemplate: {
          title: "Trayecto Taxi {taxi_id}",
          content: [
            {
              type: "fields",
              fieldInfos: [
                { fieldName: "taxi_id", label: "ID del taxi" },
                { fieldName: "timestamp", label: "Fecha y hora" }
              ]
            }
          ]
        },
        visible: false // No visible hasta que se filtre
      });

      // Función para actualizar el contador de coincidencias
      const updateFeatureCount = async () => {
        try {
          const count = await featureLayer.queryFeatureCount();
          document.getElementById("countDisplay").innerText = `Coincidencias: ${formatThousands(count)}`;
        } catch (err) {
          console.error("Error al contar las características:", err);
          document.getElementById("countDisplay").innerText = "Error al contar los resultados.";
        }
      };

      // Botón Filtrar: aplica filtros y carga la capa si aún no está en el mapa
      document.getElementById("filterBtn").addEventListener("click", () => {
        const taxiValue = document.getElementById("taxiInput").value.trim();
        const startDate = document.getElementById("startDateInput").value.trim();
        const endDate = document.getElementById("endDateInput").value.trim();

        let definition = [];

        // Filtro por ID de taxi
        if (taxiValue !== "") {
          definition.push(`taxi_id = '${taxiValue}'`);
        }

        // Filtro por rango de fechas
        if (startDate !== "" && endDate !== "") {
          definition.push(`timestamp >= '${startDate}' AND timestamp < '${endDate}'`);
        } else if (startDate !== "") {
          definition.push(`timestamp >= '${startDate}'`);
        } else if (endDate !== "") {
          definition.push(`timestamp < '${endDate}'`);
        }

        // Aplicar definición de expresión
        featureLayer.definitionExpression = definition.length ? definition.join(" AND ") : null;

        // Agregar la capa al mapa solo la primera vez
        if (!map.layers.includes(featureLayer)) {
          map.add(featureLayer);
          // Esperar que la capa se cargue antes de contar
          featureLayer.when(() => updateFeatureCount());
        } else {
          // Si ya está en el mapa, solo actualizar el contador
          updateFeatureCount();
        }

        // Asegurarse que la capa sea visible
        featureLayer.visible = true;
      });

      // Función auxiliar para formatear números con miles
      function formatThousands(num) {
        return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      }

    });
  </script>
</body>
</html>
