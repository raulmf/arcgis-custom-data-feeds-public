<!--

Timeframe:

From July 2013 to June 2014 (a full year of data).

Coverage:

Around 442 taxis operating in Porto, Portugal.

Contains about 1.7 million individual trips, each made up of timestamped GPS points collected at ~15-second intervals.

Source:

It was originally released as part of the ECML PKDD 2015 Challenge on Kaggle under the title “Predict Taxi Service Trajectory”.
-->



<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>::Integración con DuckDB::</title>

    <link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/dark/main.css" />
    <script src="https://js.arcgis.com/4.30/"></script>

    <style>
      html,
      body,
      #viewDiv {
        padding: 0;
        margin: 0;
        height: 100%;
        width: 100%;
      }

      #filterPanel {
        position: absolute;
        top: 30px;
        left: 30px;
        background: rgba(30, 30, 30, 0.95);
        padding: 20px 20px 14px 20px;
        color: white;
        z-index: 99;
        font-family: sans-serif;
        border-radius: 18px;
        font-size: 1.3em;
        box-shadow: 0 8px 32px rgba(0,0,0,0.35);
        min-width: 260px;
      }

      #filterPanel label {
        font-size: 1.2em;
        font-weight: bold;
        letter-spacing: 1px;
      }

      #taxiInput {
        width: 100%;
        font-size: 1.2em;
        padding: 10px 8px;
        margin-top: 8px;
        margin-bottom: 16px;
        border-radius: 8px;
        border: 2px solid #FF00FF;
        background: #fff0fa;
        color: #222;
        box-sizing: border-box;
        font-weight: bold;
        outline: none;
        transition: border 0.2s;
      }
      #taxiInput:focus {
        border: 2.5px solid #FF55FF;
        background: #ffe6fa;
      }

      #filterBtn {
        width: 100%;
        font-size: 1.2em;
        padding: 12px 0;
        border-radius: 8px;
        border: none;
        background: linear-gradient(90deg, #FF00FF 0%, #D500F9 100%);
        color: #fff;
        font-weight: bold;
        cursor: pointer;
        margin-bottom: 12px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        transition: background 0.2s, color 0.2s;
      }
      #filterBtn:hover, #filterBtn:focus {
        background: linear-gradient(90deg, #FF55FF 0%, #FF00FF 100%);
        color: #fff;
      }

      #countDisplay {
        margin-top: 10px;
        font-size: 2em;
        font-weight: bold;
        color: #FF00FF;
        text-shadow: 1px 1px 6px #222;
        letter-spacing: 1px;
      }
    </style>

    <script>
      require([
        "esri/Map",
        "esri/views/MapView",
        "esri/layers/FeatureLayer"
      ], (Map, MapView, FeatureLayer) => {
        const map = new Map({
          basemap: "dark-gray"
        });

        const view = new MapView({
          container: "viewDiv",
          map: map,
          extent: {
            xmin: -8.75,
            ymin: 41.10,
            xmax: -8.55,
            ymax: 41.20,
            spatialReference: 4326
          }
        });

        const featureLayer = new FeatureLayer({
          url: "http://127.0.0.1:8080/duckdb-provider-gps-cu2025/rest/services/localParquet/FeatureServer/0",
          renderer: {
            type: "simple",
            symbol: {
              type: "simple-marker",
              color: "#FF00FF",
              size: 6,
              outline: {
                color: "#000000",
                width: 0.5
              }
            }
          },
          popupTemplate: {
            title: "Información del viaje",
            content: [
              {
                type: "fields",
                fieldInfos: [
                  { fieldName: "taxi_id", label: "ID del taxi" },
                  { fieldName: "timestamp", label: "Fecha y hora" }
                ]
              }
            ]
          }
        });

        map.add(featureLayer);

        // Function to update feature count
        const updateFeatureCount = async () => {
          try {
            const count = await featureLayer.queryFeatureCount();
            document.getElementById("countDisplay").innerText = `Coincidencias: ${formatThousands(count)}`;
          } catch (err) {
            console.error("Error counting features:", err);
            document.getElementById("countDisplay").innerText = "Error al contar los resultados.";
          }
        };

        // Apply filter for taxi ID only
        document.getElementById("filterBtn").addEventListener("click", () => {
          const taxiValue = document.getElementById("taxiInput").value.trim();
          let definition = "";

          if (taxiValue !== "") {
            definition = `taxi_id = '${taxiValue}'`;
          }

          featureLayer.definitionExpression = definition || null;
          updateFeatureCount();
        });

        // Initial feature count
        featureLayer.when(() => updateFeatureCount());

        function formatThousands(num) {
          return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        }
      });
    </script>
  </head>

  <body>
    <div id="viewDiv"></div>
    <div id="filterPanel">
      <label for="taxiInput">TAXI Nº</label><br />
      <input type="text" id="taxiInput" value="20000032" />
      <br />
      <button id="filterBtn">Filtrar</button>
      <div id="countDisplay">Cargando...</div>
    </div>
  </body>
</html>
